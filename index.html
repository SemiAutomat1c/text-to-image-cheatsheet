<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Image Converter</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Text to Image Converter</h1>
        
        <div class="paper-size-info">
            <h4>Paper Size Information</h4>
            <p>A4 Paper Size: 210mm × 297mm</p>
            <p>Individual Image Size: 8.5cm × 5.5cm</p>
        </div>

        <div class="mode-select">
            <div class="radio-group">
                <label>
                    <input type="radio" name="mode" value="code" checked>
                    Code Mode
                </label>
                <label>
                    <input type="radio" name="mode" value="text">
                    Text Mode
                </label>
            </div>
        </div>

        <div class="compact-options">
            <label>
                <input type="checkbox" id="compactMode">
                Compact Mode
            </label>
            <label>
                <input type="checkbox" id="ultraCompact">
                Ultra Compact
            </label>
        </div>

        <div class="image-quality-options">
            <h4>Quality Settings</h4>
            <div class="quality-controls">
                <div class="quality-control">
                    <label for="fontSize">Font Size:</label>
                    <input type="range" id="fontSize" min="8" max="16" value="12">
                    <span id="fontSizeValue">12</span>
                </div>
                <div class="quality-control">
                    <label for="scaleFactor">Scale Factor:</label>
                    <input type="range" id="scaleFactor" min="1" max="4" value="2">
                    <span id="scaleFactorValue">2</span>
                </div>
                <div class="quality-control">
                    <label>
                        <input type="checkbox" id="antiAlias" checked>
                        Anti-aliasing
                    </label>
                </div>
                <div class="quality-control">
                    <label>
                        <input type="checkbox" id="highContrast">
                        High Contrast
                    </label>
                </div>
            </div>
        </div>

        <textarea id="textInput" placeholder="Enter your text here..."></textarea>

        <div class="button-group">
            <button onclick="previewImage()" class="preview-btn">Preview</button>
            <button id="downloadAllBtn" class="btn btn-warning" onclick="downloadAllImages()">Download All</button>
            <button id="downloadPdfBtn" class="btn btn-danger">Download as PDF</button>
            <button onclick="downloadIndividualImages()" class="btn btn-info">Download Individual Images</button>
            <button onclick="setExampleText()">Load Example</button>
        </div>

        <div id="previewContainer" class="preview-container" style="display: none;">
            <div id="previewGrid" class="preview-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
